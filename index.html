<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Simple Website</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #333;
      text-align: center;
    }

    header {
      background: #4a90e2;
      color: white;
      padding: 40px 20px;
    }

    section {
      margin: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #4a90e2;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #357ab8;
    }
  </style>
</head>

<body>

  <header>
    <h1>Hi 👋 I'm a Web Developer</h1>
    <p>Welcome to my simple website</p>
  </header>

  <section>
    <h2>About Me</h2>
    <p>I am learning HTML, CSS and JavaScript.</p>
  </section>

  <section>
    <h2>My Skills</h2>
    <p>HTML | CSS | JavaScript</p>
  </section>

  <section>
    <h2>Contact</h2>
    <p>Email: example@gmail.com</p>
    <button onclick="alert('Thanks for visiting!')">Click Me</button>
  </section>

</body>
</html>
